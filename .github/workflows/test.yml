name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} --with coverage coverage run --branch --source cppcrap -m unittest -v
      - run: uv run --no-project --python ${{ matrix.python }} --with coverage coverage report -m --fail-under 95
